    <!-- symcon-icons-shared: Quelle visu-messung/baustein/tile-icons-shared.js, verteilt per verteilen.py -->
    <script>
/* symcon-icons-shared v3: Symcons /icons.js läuft einmal im Visu-Hauptfenster statt in jeder Kachel.
   Ersetzt das Script-Tag für /icons.js im head einer Kachel. Ohne erreichbares Hauptfenster
   (Symcon-App, direkter Aufruf, PWA) lädt die Kachel icons.js wie bisher. Symcon bleibt unverändert.
   Steht inline in einem script-Element: niemals ein schließendes Script-Tag in diesen Text schreiben.
   Quelle: visu-messung/baustein/tile-icons-shared.js, verteilt per verteilen.py - Kopien nicht von Hand ändern. */
(function () {
  var w = window, d = document, host = null;
  try {
    // Fremder Ursprung wirft schon beim Zugriff auf top.document.
    if (w.top !== w && w.top.document.head) host = w.top;
  } catch (e) {
    host = null;
  }
  var slot = host ? host.__symconIcons : null;
  if (slot && slot.v >= 1 && slot.fa) {
    teilen(slot.fa, slot.css);
    return;
  }
  // Kein Hauptfenster, oder es lädt icons.js gerade erst: für sich laden wie bisher - synchron,
  // damit die Kachel-Skripte FontAwesome wie gewohnt vorfinden.
  d.write('<script src="/icons.js" crossorigin="anonymous"><\/script>'); // sicher: fester Text ohne Eingabe, das bisherige icons.js-Tag
  if (!host) return;
  if (!slot) {
    // Einmal im Hauptfenster nachladen, ohne dass FontAwesome dort das Flutter-DOM anfasst.
    try {
      // Slot und Konfiguration als Objekte des Hauptfensters: ein Objekt dieser Kachel hielte sie
      // (samt Dokument) fest, solange das Hauptfenster lebt. Aus demselben Grund lösen die Lade-Handler
      // sich nach dem Laden selbst.
      slot = new host.Object();
      slot.v = 1;
      slot.fa = null;
      slot.css = '';
      slot.fehler = false;
      host.__symconIcons = slot;
      var config = new host.Object();
      config.autoReplaceSvg = false;
      config.observeMutations = false;
      config.autoAddCss = false;
      host.FontAwesomeConfig = config;
      var s = host.document.createElement('script');
      s.src = '/icons.js';
      s.onload = function () {
        if (host.FontAwesome && host.FontAwesome.dom) {
          slot.css = host.FontAwesome.dom.css();
          slot.fa = host.FontAwesome;
        } else {
          slot.fehler = true;
        }
        s.onload = s.onerror = null;
      };
      s.onerror = function () {
        slot.fehler = true;
        s.onload = s.onerror = null;
      };
      host.document.head.appendChild(s);
    } catch (e) {
      return; // Hauptfenster nimmt kein Skript an: die Kachel bleibt beim eigenen icons.js.
    }
  }
  // Kacheln kommen beim ersten Laden fast gleichzeitig: bis das Hauptfenster bereit ist, arbeitet
  // die eigene Kopie, danach wechselt die Kachel auf die geteilte und gibt ihre eigene frei.
  var versuche = 0;
  var abwarten = function () {
    if (slot.fa && d.readyState !== 'loading') {
      wechseln(slot);
    } else if (!slot.fehler && ++versuche <= 100) {
      setTimeout(abwarten, 100);
    }
  };
  setTimeout(abwarten, 100);

  function wechseln(slot) {
    var eigen = w.FontAwesome;
    if (!eigen || eigen === slot.fa) return;
    try {
      eigen.noAuto(); // stoppt den Beobachter der eigenen Kopie
    } catch (e) {
      return; // eigene Kopie lässt sich nicht anhalten: bei ihr bleiben statt doppelt zu wandeln
    }
    // Alle drei Globalen von icons.js lösen, sonst hält FontAwesomeConfig (Getter/Setter) die Kopie fest
    var namen = ['FontAwesome', '___FONT_AWESOME___', 'FontAwesomeConfig'];
    for (var i = 0; i < namen.length; i++) {
      try {
        delete w[namen[i]];
      } catch (e) {
        w[namen[i]] = undefined;
      }
    }
    teilen(slot.fa, slot.css);
  }

  function teilen(fa, css) {
    w.FontAwesome = fa; // findIconDefinition/i2svg der Kachel-Skripte laufen unverändert weiter
    var st = d.createElement('style');
    st.textContent = css;
    (d.head || d.documentElement).appendChild(st);
    var wandeln = function (knoten) {
      try {
        fa.dom.i2svg({ node: knoten });
      } catch (e) {
        // Knoten schon entfernt oder Hauptfenster weg: nichts zu zeichnen.
      }
    };
    // Eigener Beobachter im Fenster der Kachel: er endet mit ihr (dom.watch im Hauptfenster hielte
    // alte Kachel-Dokumente fest). Wie bei icons.js: neue Knoten und Klassenwechsel am gezeichneten SVG.
    var start = function () {
      wandeln(d.body);
      new MutationObserver(function (liste) {
        var ziele = [];
        for (var i = 0; i < liste.length; i++) {
          var m = liste[i], t = m.target;
          if (m.type === 'childList') {
            if (m.addedNodes.length && ziele.indexOf(t) < 0) ziele.push(t);
          } else if (t.getAttribute && t.getAttribute('data-fa-i2svg') !== null && anderesIcon(t)) {
            neuZeichnen(t);
          }
        }
        for (var j = 0; j < ziele.length; j++) {
          if (ziele[j].isConnected) wandeln(ziele[j]);
        }
      }).observe(d.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    };
    if (d.body) {
      start();
    } else {
      d.addEventListener('DOMContentLoaded', start);
    }
  }

  // Nennen die Klassen des SVG ein anderes Icon als das gezeichnete (data-icon)?
  function anderesIcon(svg) {
    return (' ' + (svg.getAttribute('class') || '') + ' ').indexOf(' fa-' + svg.getAttribute('data-icon') + ' ') < 0;
  }

  // SVG durch ein <i> mit seinen Klassen ersetzen; der Beobachter zeichnet es neu.
  function neuZeichnen(svg) {
    if (!svg.parentNode) return;
    var klassen = (svg.getAttribute('class') || '').replace(/(^|\s)svg-inline--fa(?=\s|$)/g, ' ').trim();
    if (!/(^|\s)(fa-(light|brands|kit|solid|regular|thin|duotone|sharp)|fa[lbkrstd])(\s|$)/.test(klassen)) {
      klassen += ' ' + (svg.getAttribute('data-prefix') || 'fal'); // icons.js lässt die Stilklasse am SVG weg
    }
    var ersatz = d.createElement('i');
    ersatz.className = klassen;
    svg.parentNode.replaceChild(ersatz, svg);
  }
})();
    </script>

<style>
  html, body { margin: 0; height: 100%; }
  body { width: auto; background: transparent; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--content-color); }
  #app {
    --dim: color-mix(in srgb, var(--content-color) 60%, transparent);
    --soft: color-mix(in srgb, var(--content-color) 10%, transparent);
    --line: color-mix(in srgb, var(--content-color) 22%, transparent);
    --fill: color-mix(in srgb, var(--content-color) 10%, var(--card-color));
    --pv: #f5b83d; --bezug: #ff6b6b; --einsp: #2ecc71; --akku: #4da3ff;
    position: fixed; inset: 0; box-sizing: border-box; display: flex; flex-direction: column;
    padding: var(--mt, 36px) var(--ms, 12px) var(--mb, 12px);
  }
  #flow {
    position: relative; flex: 1; min-height: 0; container-type: size;
    display: flex; flex-direction: column; justify-content: space-between; padding: 2px 4% 0;
    --d: clamp(44px, min(21cqh, 17cqw), 76px);
  }
  #app.nocons #flow { --d: clamp(44px, min(28cqh, 19cqw), 76px); justify-content: space-around; }
  #lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .row { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .r1 { flex-direction: column; justify-content: center; gap: 6px; }
  .pvrow { display: flex; justify-content: center; gap: calc(var(--d) * 1.3); }
  .pvsum { display: none; font-size: 12px; font-weight: 600; white-space: nowrap; text-align: center; line-height: 1.25; }
  .pvsum b { display: block; font-size: 15px; font-weight: 700; }
  #app.multi .pvsum { display: block; }
  #app.multi .side, #app:not(.multi) #n-pv2 { display: none; }
  .r2 { margin-bottom: 1.5em; }
  .r3 { justify-content: space-around; align-items: flex-start; }
  #app.nocons .r3 { display: none; }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; --c: var(--accent-color); }
  .node.off { visibility: hidden; }
  .cons.off { display: none; }
  .c {
    position: relative; box-sizing: border-box; width: var(--d); height: var(--d); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    /* Deckend, damit die Linien unter dem Kreis enden und nicht hineinragen. */
    border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 14%, var(--card-color));
  }
  .c .ic { font-size: calc(var(--d) * .27); color: var(--c); }
  .c b { font-size: calc(var(--d) * .19); font-weight: 700; white-space: nowrap; }
  #n-haus .c { width: calc(var(--d) * 1.22); height: calc(var(--d) * 1.22); --c: var(--content-color); background: var(--fill); }
  #n-haus .c b { font-size: calc(var(--d) * .22); }
  .node.pv { --c: var(--pv); }
  #n-speicher { --c: var(--akku); }
  .node.bezug { --c: var(--bezug); }
  .node.einsp { --c: var(--einsp); }
  .node.idle .c { border-color: var(--line); background: var(--fill); }
  .node.idle .c .ic { color: var(--dim); }
  .side { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 600; }
  i { font-style: normal; }
  .side small, .cons small { font-size: 10px; font-weight: 400; color: var(--dim); }
  .cons small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lab { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--c); }
  .node.idle .lab { color: var(--dim); }
  .ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); fill: none; stroke-width: 5; }
  .ring .trk { stroke: var(--soft); }
  .ring .val { stroke: var(--c); }
  .node.nosoc .ring { display: none; }
  #n-wallbox:not(.nosoc) .c, #n-wp:not(.nosoc) .c { margin-bottom: 10px; }
  .cons { width: 25%; min-width: 0; text-align: center; gap: 1px; }
  .cons .c { width: calc(var(--d) * .78); height: calc(var(--d) * .78); margin-bottom: 4px; }
  .cons .c .ic { font-size: calc(var(--d) * .3); }
  .cons > b { font-size: 13px; font-weight: 700; }
  .cons.idle > b { color: var(--dim); }
  .cons > span { font-size: 11px; color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #lines g { --c: var(--accent-color); }
  #lines g[data-role="pv"] { --c: var(--pv); }
  #lines g[data-role="bezug"] { --c: var(--bezug); }
  #lines g[data-role="einsp"] { --c: var(--einsp); }
  #lines g[data-role="speicher"] { --c: var(--akku); }
  .base, .flow { fill: none; stroke-linejoin: round; }
  /* Die Linie ist 2 px dicker als ihr Hauptpunkt (Punkt 7, 8 oder 10 px je nach Leistung). */
  .base { stroke: var(--line); stroke-width: 9; }
  g[data-on="1"][data-lvl="2"] .base { stroke-width: 10; }
  g[data-on="1"][data-lvl="3"] .base { stroke-width: 12; }
  g[data-on="1"] .base { stroke: color-mix(in srgb, var(--c) 35%, transparent); }
  .flow { stroke: var(--c); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 0.1 36; opacity: 0; }
  g[data-lvl="1"] .flow { stroke-width: 7; }
  g[data-lvl="3"] .flow { stroke-width: 10; }
  .anim g[data-on="1"] .flow { opacity: 1; animation: flow 3.6s linear infinite; }
  .anim g[data-rev="1"] .flow { animation-direction: reverse; }
  /* Schweif: drei kleiner und blasser werdende Punkte hinter jedem Punkt, im selben Takt wie der Punkt. */
  .tail { fill: none; stroke: var(--c); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 36; opacity: 0; --o: var(--b); }
  .t1 { stroke-width: 6; --b: 8px; }
  .t2 { stroke-width: 4.5; --b: 14.5px; }
  .t3 { stroke-width: 3; --b: 20px; }
  .anim g[data-on="1"] .tail { animation: flow 3.6s linear infinite; }
  .anim g[data-on="1"] .t1 { opacity: .65; }
  .anim g[data-on="1"] .t2 { opacity: .42; }
  .anim g[data-on="1"] .t3 { opacity: .25; }
  .anim g[data-rev="1"] .tail { animation-direction: reverse; --o: calc(var(--b) * -1); }
  @keyframes flow { from { stroke-dashoffset: var(--o, 0px); } to { stroke-dashoffset: calc(var(--o, 0px) - 36px); } }
  .arr { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: none; }
  #app:not(.anim) g[data-on="1"] .arr { display: block; }

  .band { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--soft); }
  #bandS, #app.short #band, #app.noband .band { display: none; }
  #app.short:not(.noband) #bandS { display: flex; }
  .grp { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .st { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .st b { font-size: 17px; font-weight: 700; white-space: nowrap; }
  #bandS .st b { font-size: 14px; }
  .st span, .rg span { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st.bezug b { color: var(--bezug); }
  .st.einsp b { color: var(--einsp); }
  .st.acc b { color: var(--accent-color); }
  .rg { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rg div { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .rg svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); fill: none; stroke-width: 9; }
  .rg .trk { stroke: var(--soft); }
  .rg .val { stroke: var(--accent-color); }
  /* Tagesenergie und Geld als Balken: Länge im Verhältnis zum größten Wert der Gruppe. */
  .en, .money { display: grid; grid-template-columns: auto minmax(40px, 1fr) auto; align-items: center; column-gap: 8px; row-gap: 4px; font-size: 11px; color: var(--dim); }
  .en { flex: 1.6 1 0; max-width: 330px; }
  .money { flex: 1 1 0; max-width: 210px; row-gap: 7px; }
  .en > b, .money > b { font-size: 12px; font-weight: 700; color: var(--content-color); text-align: right; white-space: nowrap; }
  .en > small { grid-column: 2 / 4; margin: -1px 0 4px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en > small b { color: var(--content-color); font-weight: 600; }
  .en > small .dot:not(:first-child) { margin-left: 8px; }
  .bt { display: flex; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  .bt i { display: block; height: 100%; width: 0; transition: width .4s ease; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .eig { background: var(--pv); }
  .ein { background: var(--einsp); }
  .bez { background: var(--bezug); }
  .acc { background: var(--accent-color); }
  @media (prefers-reduced-motion: reduce) { .flow, .tail { animation: none !important; } }
</style>
</head>

<div id="app">
  <div id="flow">

    <div class="row r1">
      <div class="pvsum"><span data-t="Photovoltaics"></span> <b id="v-pvsum"></b></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const app = $('app');
  const CONS = ['wp', 'wallbox', 'heizstab', 'rest'];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let S = null, T = {}, segs = [], last = '', nodes = '';

  // Die Ränder gibt die Visu vor (Titel und Vollbild-Symbol liegen über der Kachel).
  const query = new URLSearchParams(location.search);
  [['mt', 'margintop'], ['ms', 'marginside'], ['mb', 'marginbottom']].forEach(([name, key]) => {
    const value = parseInt(query.get(key), 10);
    if (value >= 0) app.style.setProperty('--' + name, value + 'px');
  });

  const t = key => T[key] || key;
  const num = (v, d) => Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const watt = v => { v = Math.abs(v); return v < 1000 ? Math.round(v) + ' W' : num(v / 1000, v < 10000 ? 1 : 0) + ' kW'; };
  const text = (id, value) => { const e = $(id); if (e.textContent !== value) e.textContent = value; };
  const cls = (e, name, on) => { if (e.classList.contains(name) !== on) e.classList.toggle(name, on); };
  const attr = (e, name, value) => { if (e.getAttribute(name) !== value) e.setAttribute(name, value); };
  const shown = key => key === 'rest' ? CONS.some(k => k !== 'rest' && S.knoten[k]) : S.knoten[key] !== false;

  function sizes() {
    const w = innerWidth, h = innerHeight;
    cls(app, 'nocons', !S || !shown('rest') || h < 380);
    cls(app, 'short', w < 520);
    cls(app, 'noband', h < 230);
  }

  // Die Linien folgen den Kreisen: neu gezeichnet wird nur, wenn sich das Layout ändert.
  function layout() {
    if (!S) return;
    const f = $('flow').getBoundingClientRect();
    const box = key => {
      const node = $('n-' + key), r = node.querySelector('.c').getBoundingClientRect();
      // Die Linie endet knapp unter dem Rand des Kreises, bei einem Ring unter dem Ringband.
      const ring = node.querySelector('.ring') && !node.classList.contains('nosoc');
      return { k: key, x: r.left - f.left + r.width / 2, y: r.top - f.top + r.height / 2, r: r.width / 2 + (ring ? 5 : -1) };
    };
    // Jede Linie ist ein Streckenzug; Ecken werden abgerundet, damit Linie und Punkte um die Ecke laufen.
    const L = [];
    const add = (k, role, pts, val) => L.push({ k, role, pts, val });
    const h = box('haus'), n = box('netz');
    // Jede PV-Anlage hat ihre eigene Linie zum Haus; bei mehreren landen sie nebeneinander auf dem Haus.
    const pvs = (S.knoten.pv2 ? [['pv', 'pv1'], ['pv2', 'pv2']] : [['pv', 'pv']]).map(([k, w]) => Object.assign(box(k), { w })).sort((a, b) => a.x - b.x);
    const pvGap = Math.min(17, h.r * 0.5);
    pvs.forEach((o, i) => {
      const dx = (i - (pvs.length - 1) / 2) * pvGap, ex = h.x + dx, ey = h.y - Math.sqrt(Math.max(0, h.r * h.r - dx * dx));
      // Mehrere Anlagen: seitlich aus dem Kreis zur Mitte hin, dann mit runder Ecke nach unten aufs Haus.
      const pts = Math.abs(o.x - ex) < 1 ? [[o.x, o.y + o.r], [ex, ey]] : [[o.x + Math.sign(ex - o.x) * o.r, o.y], [ex, o.y], [ex, ey]];
      add(o.k, 'pv', pts, s => s.w[o.w]);
    });
    add('netz', 'netz', [[n.x + n.r, n.y], [h.x - h.r, h.y]], s => s.w.netz);
    if (shown('speicher')) {
      const b = box('speicher');
      add('speicher', 'speicher', [[h.x + h.r, h.y], [b.x - b.r, b.y]], s => s.w.speicher);
    }
    if (!app.classList.contains('nocons')) {
      // Jeder Verbraucher hat seine eigene Linie ab dem Haus. Die äußeren starten weiter außen und
      // biegen höher ab, die inneren tiefer: so kreuzt sich nichts.
      const c = CONS.filter(shown).map(box).sort((a, b) => a.x - b.x);
      const from = h.y + h.r, top = Math.min(...c.map(o => o.y - o.r));
      const gap = Math.min(17, h.r * 0.5);
      const depth = side => side.forEach((o, i) => { o.lvl = from + (top - from) * (i + 1) / (side.length + 1); });
      depth(c.filter(o => o.x < h.x - 1));
      depth(c.filter(o => o.x > h.x + 1).reverse());
      c.forEach((o, i) => {
        const dx = (i - (c.length - 1) / 2) * gap, sx = h.x + dx, sy = h.y + Math.sqrt(Math.max(0, h.r * h.r - dx * dx));
        const pts = o.lvl === undefined ? [[sx, sy], [o.x, o.y - o.r]] : [[sx, sy], [sx, o.lvl], [o.x, o.lvl], [o.x, o.y - o.r]];
        add('c-' + o.k, 'cons', pts, s => Math.max(0, s.w[o.k]));
      });
    }
    const p = v => v.toFixed(1);
    const len = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
    const at = (a, b, d) => { const l = len(a, b) || 1; return p(a[0] + (b[0] - a[0]) * d / l) + ' ' + p(a[1] + (b[1] - a[1]) * d / l); };
    const path = pts => pts.map((b, i) => {
      if (i === 0) return 'M' + p(b[0]) + ' ' + p(b[1]);
      const a = pts[i - 1], c = pts[i + 1];
      if (!c) return 'L' + p(b[0]) + ' ' + p(b[1]);
      const r = Math.min(14, len(a, b) / 2, len(b, c) / 2);
      return 'L' + at(b, a, r) + 'Q' + p(b[0]) + ' ' + p(b[1]) + ' ' + at(b, c, r);
    }).join('');
    $('lines').innerHTML = L.map(s => {
      const d = path(s.pts);
      return `<g data-k="${s.k}"><path class="base" d="${d}"/><path class="flow" d="${d}"/><path class="tail t1" d="${d}"/><path class="tail t2" d="${d}"/><path class="tail t3" d="${d}"/><path class="arr" d="M-5-7L4 0l-9 7"/></g>`;
    }).join('');
    segs = L.map((s, i) => {
      // Der Pfeil (Animation aus) sitzt in der Mitte des längsten geraden Stücks.
      let a = s.pts[0], b = s.pts[1];
      s.pts.forEach((q, k) => { if (k && len(s.pts[k - 1], q) > len(a, b)) { a = s.pts[k - 1]; b = q; } });
      return Object.assign(s, { g: $('lines').children[i], mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, a: Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI });
    });
    flows();
  }

  function flows() {
    segs.forEach(s => {
      const v = s.val(S), on = Math.abs(v) > S.schwelle, rev = v < 0, mag = Math.abs(v);
      attr(s.g, 'data-role', s.role === 'netz' ? (rev ? 'einsp' : 'bezug') : s.role);
      attr(s.g, 'data-on', on ? '1' : '0');
      attr(s.g, 'data-rev', rev ? '1' : '0');
      attr(s.g, 'data-lvl', mag < 500 ? '1' : mag < 2500 ? '2' : '3');
      // Tempo stufenlos nach Leistung: die Abspielrate ändert sich, ohne dass die Punkte springen.
      // Logarithmisch, damit sich auch 20 W und 500 W deutlich unterscheiden: 0,25-fach bei 20 W, 4-fach ab 15 kW.
      const rate = 0.25 * Math.pow(16, Math.min(1, Math.max(0, Math.log(mag / 20) / Math.log(750))));
      attr(s.g, 'data-rate', rate.toFixed(2));
      if (on) s.g.querySelectorAll('.flow, .tail').forEach(e => e.getAnimations().forEach(a => { a.playbackRate = rate; }));
      attr(s.g.lastChild, 'transform', `translate(${s.mx.toFixed(1)} ${s.my.toFixed(1)}) rotate(${(s.a + (rev ? 180 : 0)).toFixed(0)})`);
    });
  }

  function render() {
    const w = S.w, q = S.schwelle, tag = S.tag;
    cls(app, 'anim', !!S.animation && !still);
    const multi = !!S.knoten.pv2;
    cls(app, 'multi', multi);
    text('v-pvsum', watt(w.pv));
    text('v-pv', watt(multi ? w.pv1 : w.pv));
    text('v-pv2', watt(w.pv2));
    cls($('n-pv'), 'idle', (multi ? w.pv1 : w.pv) <= q);
    cls($('n-pv2'), 'idle', w.pv2 <= q);
    text('v-haus', watt(w.haus));
    const netz = $('n-netz'), im = w.netz > q, ex = w.netz < -q;
    text('v-netz', watt(w.netz));
    text('l-netz', t(im ? 'Grid import' : ex ? 'Feeding in' : 'Grid'));
    cls(netz, 'bezug', im); cls(netz, 'einsp', ex); cls(netz, 'idle', !im && !ex);
    const akku = $('n-speicher'), soc = S.soc === null ? '' : ' · ' + S.soc + ' %';
    cls(akku, 'off', !shown('speicher'));
    cls(akku, 'nosoc', S.soc === null);
    cls(akku, 'idle', Math.abs(w.speicher) <= q);
    text('v-speicher', watt(w.speicher));
    text('l-speicher', t(w.speicher > q ? 'charging' : w.speicher < -q ? 'discharging' : 'Battery') + soc);
    attr($('soc'), 'stroke-dasharray', (S.soc || 0) + ' 100');
    CONS.forEach(k => {
      const e = $('n-' + k);
      cls(e, 'off', !shown(k));
      cls(e, 'idle', w[k] <= q);
      text('v-' + k, watt(Math.max(0, w[k])));
    });
    const auto = S.socWallbox === null || S.socWallbox === undefined ? null : S.socWallbox;
    cls($('n-wallbox'), 'nosoc', auto === null);
    text('d-wallbox', auto === null ? '' : auto + ' %');
    attr($('soc-wallbox'), 'stroke-dasharray', (auto || 0) + ' 100');
    const heat = S.waermeMax > 0 && typeof S.waerme === 'number' ? Math.max(0, S.waerme) : null;
    cls($('n-wp'), 'nosoc', heat === null);
    text('h-wp', heat === null ? '' : t('Heat') + ' ' + watt(heat));
    attr($('soc-wp'), 'stroke-dasharray', (heat === null ? 0 : Math.min(100, Math.round(heat / S.waermeMax * 100))) + ' 100');
    text('d-wp', [S.cop > 0 ? t('COP') + ' ' + num(S.cop, 1) : '', S.az > 0 ? t('PF') + ' ' + num(S.az, 1) : ''].filter(Boolean).join(' · '));
    // Balken der Tagesenergie: PV = Eigenverbrauch + Einspeisung, Verbrauch = eigener Strom + Bezug.
    const eigenPv = Math.max(0, tag.pv - tag.einspeisung), eigenHaus = Math.max(0, tag.haus - tag.bezug);
    const scale = Math.max(tag.pv, tag.haus, 0.01), geld = Math.max(tag.ersparnis, tag.erloes, tag.kosten, 0.01);
    const bar = (id, value, max) => { const e = $(id), w = Math.min(100, value / max * 100).toFixed(1) + '%'; if (e.style.width !== w) e.style.width = w; };
    bar('b-eigenpv', eigenPv, scale); bar('b-einspeisung', Math.min(tag.einspeisung, tag.pv), scale);
    bar('b-eigenhaus', eigenHaus, scale); bar('b-bezug', Math.min(tag.bezug, tag.haus), scale);
    text('t-pv', num(tag.pv, 1) + ' kWh'); text('t-haus', num(tag.haus, 1) + ' kWh');
    text('t-eigenpv', num(eigenPv, 1)); text('t-einspeisung', num(tag.einspeisung, 1));
    text('t-eigenhaus', num(eigenHaus, 1)); text('t-bezug', num(tag.bezug, 1));
    ['ersparnis', 'erloes', 'kosten'].forEach(k => bar('b-' + k, tag[k], geld));
    ['autarkie', 'eigenquote'].forEach(k => {
      text('q-' + k, String(S[k]));
      text('s-' + k, S[k] + ' %');
      attr($('r-' + k), 'stroke-dasharray', S[k] + ' 100');
    });
    ['ersparnis', 'erloes', 'kosten'].forEach(k => text('g-' + k, num(tag[k], 2) + ' €'));
    text('s-pv', num(tag.pv, 1) + ' kWh');
    text('s-ersparnis', num(tag.ersparnis, 2) + ' €');
  }

  function onMessage(data) {
    let msg = data;
    if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch (e) { return; } }
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'reload') { location.reload(); return; }
    if (msg.type !== 'state' || !msg.w || !msg.knoten || !msg.tag) return;
    const raw = JSON.stringify(msg);
    if (raw === last) return;   // jede Nachricht kommt auf zwei Wegen an
    last = raw;
    if (msg.texts) {
      T = msg.texts;
      document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
    }
    S = msg;
    render();
    const now = JSON.stringify([msg.knoten, msg.soc === null, msg.socWallbox == null, !(msg.waermeMax > 0)]);
    if (now !== nodes) { nodes = now; sizes(); layout(); } else { flows(); }
  }

  window.handleMessage = onMessage;
  window.addEventListener('message', event => {
    if (!event || (event.source !== window && event.source !== window.parent)) return;
    onMessage(event.data);
  });
  if (window.ResizeObserver) new ResizeObserver(() => { sizes(); layout(); }).observe($('flow'));
  window.addEventListener('resize', () => { sizes(); layout(); });
})();
</script>
</body>
</html>
